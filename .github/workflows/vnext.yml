name: Sprintique vNext
on:
  pull_request:
    paths: ['products/sprintique/**', 'libraries/iquipage/**', 'scripts/verify-vnext.mjs', 'scripts/verify-extraction.mjs', 'scripts/vnext/**', '.github/workflows/vnext.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vnext-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SPRINTIQUE_TEST_DOCKER: '1'
      SPRINTIQUE_DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install independent packages
        run: |
          npm ci --ignore-scripts --no-fund --prefix libraries/iquipage
          npm ci --ignore-scripts --no-fund --prefix products/sprintique
      - name: Install temporary frontend browser tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sprintique-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/sprintique-browser-tools" --no-save --package-lock=false --ignore-scripts --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/sprintique-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      # Historical counterexample for this repair only. Future PR bases already contain the fix.
      - name: Planning selected-row overlap on the immutable baseline
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/planning-selection-space' }}
        env:
          PLANNING_BASELINE_SHA: f5f941afa4e9be8a709e6de67a92bacf5a9397ca
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sprintique-browser-tools/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sprintique-browsers
          PLANNING_EVIDENCE_DIR: ${{ github.workspace }}/products/sprintique/output/planning-selection/baseline
        run: |
          git fetch --no-tags --depth=1 origin "$PLANNING_BASELINE_SHA"
          planning_baseline_dir="$RUNNER_TEMP/planning-baseline"
          mkdir -p "$planning_baseline_dir"
          git archive "$PLANNING_BASELINE_SHA" products/sprintique | tar -x -C "$planning_baseline_dir"
          mkdir -p "$planning_baseline_dir/products/sprintique/tests/fixtures"
          cp -R products/sprintique/tests/fixtures/planning-selection "$planning_baseline_dir/products/sprintique/tests/fixtures/"
          cp products/sprintique/tests/planning-selection-space.browser.mjs "$planning_baseline_dir/products/sprintique/tests/"
          npm ci --ignore-scripts --no-fund --prefix "$planning_baseline_dir/products/sprintique"
          if PLANNING_SOURCE_REVISION="$PLANNING_BASELINE_SHA" node "$planning_baseline_dir/products/sprintique/tests/planning-selection-space.browser.mjs"; then
            echo "Expected the unchanged Planning source to reproduce PF02 overlap." >&2
            exit 1
          fi
          node products/sprintique/tests/planning-selection-baseline-proof.mjs "$PLANNING_EVIDENCE_DIR/results.json"
      - name: Planning selection geometry and affected interactions
        working-directory: products/sprintique
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sprintique-browser-tools/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sprintique-browsers
          PLANNING_SOURCE_REVISION: ${{ github.sha }}
          PLANNING_EVIDENCE_DIR: ${{ github.workspace }}/products/sprintique/output/planning-selection/candidate
        run: node tests/planning-selection-space.browser.mjs
      - name: Start private ephemeral storage
        working-directory: products/sprintique
        run: |
          node scripts/local-storage.mjs
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {S3Client,HeadBucketCommand} from "@aws-sdk/client-s3"; const c=JSON.parse(await readFile("output/infra/storage.json")); const s=new S3Client({endpoint:c.endpoint,region:c.region,forcePathStyle:true,credentials:c}); for(let n=0;;n++){try{await s.send(new HeadBucketCommand({Bucket:c.bucket}));break;}catch(e){if(n===20)throw Error("Storage not ready");await new Promise(r=>setTimeout(r,1000));}}s.destroy();'
      - name: Library, product, real services and detached extraction
        run: node scripts/verify-vnext.mjs
      - name: Verification certificate in job log
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module -e 'import {readdir,readFile} from "node:fs/promises";const root="products/sprintique/output/verification";for(const dir of (await readdir(root)).sort()){console.log(await readFile(`${root}/${dir}/verification.json`,"utf8"));console.log(await readFile(`${root}/${dir}/source-stability.log`,"utf8"));}'
      - name: Portable runtime image
        working-directory: products/sprintique
        run: |
          npm run build:image
          docker load --input server/build/jib-image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true # Certificate remains in the job log if account artifact quota is exhausted.
        if: ${{ !cancelled() }}
        with:
          name: vnext-verification
          path: |
            products/sprintique/output/verification/
            products/sprintique/output/planning-selection/
          retention-days: 14
          if-no-files-found: error
