name: Planning acceptance
on:
  pull_request:
    branches: [main]
    paths: ['packages/planning/**', 'packages/maps/**', 'design-system/**', '.github/workflows/planning.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, codex-server]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund --no-audit
        working-directory: packages/maps
      - run: npx --no-install playwright install chromium
        working-directory: packages/maps
      - run: npm ci --ignore-scripts --no-fund --no-audit
        working-directory: packages/planning
      - run: npm run verify
        working-directory: packages/planning
        env:
          MAPS_LLM_GATEWAY: ''
          MAPS_LLM_GATEWAY_TOKEN: ''
          MAPS_WEBHOOK_SECRET: ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: planning-acceptance
          path: packages/planning/evidence/
          retention-days: 14
          if-no-files-found: error
