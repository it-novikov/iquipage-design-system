name: Maps acceptance
on:
  pull_request:
    branches: [main]
    paths: ['packages/maps/**', 'design-system/**', '.github/workflows/maps.yml']
  push:
    branches: [main]
    paths: ['packages/maps/**', 'design-system/**', '.github/workflows/maps.yml']
permissions:
  contents: read
concurrency:
  group: maps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, codex-server]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/maps
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npx --no-install playwright install chromium
      - run: npm run verify
        env:
          MAPS_LLM_GATEWAY: ''
          MAPS_LLM_GATEWAY_TOKEN: ''
          MAPS_WEBHOOK_SECRET: ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: maps-acceptance
          path: |
            packages/maps/artifacts/final/
            packages/maps/artifacts/r3/*report.json
            packages/maps/artifacts/board-b1/
          retention-days: 14
          if-no-files-found: error
