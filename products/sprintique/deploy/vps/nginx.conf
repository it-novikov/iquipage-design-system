# /etc/nginx/sites-enabled/sprintique.conf — TLS in front of the API on 127.0.0.1:4311 (SPRINTIQUE_TRUST_PROXY=1).
# The API sets HSTS, COOP and its own security headers; nginx only terminates TLS and forwards the client address.
server {
 listen 80; listen [::]:80; server_name sprintique.iqui.page;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
 location / { return 308 https://sprintique.iqui.page$request_uri; }
}
server {
 listen 443 ssl; listen [::]:443 ssl; http2 on; server_name sprintique.iqui.page;
 ssl_certificate /etc/letsencrypt/live/sprintique.iqui.page/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/sprintique.iqui.page/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3; server_tokens off;
 gzip on; gzip_vary on; gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
 # The API bounds bodies per route (uploads 10 MiB); nginx only stops what the API would refuse anyway.
 client_max_body_size 11m;
 access_log off; error_log /var/log/nginx/sprintique-error.log warn;
 location / {
  proxy_pass http://127.0.0.1:4311; proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s; proxy_send_timeout 60s;
  # Live updates are server-sent events: no buffering, long reads.
  proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 1h;
 }
}
