# Sprintique on one VPS: PostgreSQL in a container, the API and the worker on the host network so that nginx and the
# loopback mail relay (Postfix with DKIM) are reachable on 127.0.0.1. Secrets live in ./secrets (mode 0600), never here.
# The server image is loaded from the Jib tarball and tagged by commit: SPRINTIQUE_IMAGE=sprintique-server:<commit>.
name: sprintique-vnext

x-server: &server
  image: ${SPRINTIQUE_IMAGE:?set SPRINTIQUE_IMAGE}
  network_mode: host
  read_only: true
  tmpfs:
    - /tmp:size=256m,noexec,nosuid
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    env_file: secrets/postgres.env
    ports:
      - 127.0.0.1:54330:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256m
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d sprintique]
      interval: 5s
      timeout: 3s
      retries: 20

  # A pre-start job with the migration role: `docker compose --profile migrate run --rm migrate`.
  migrate:
    <<: *server
    profiles: [migrate]
    command: [migrate]
    env_file: secrets/migrate.env
    mem_limit: 768m

  api:
    <<: *server
    restart: unless-stopped
    env_file: [secrets/storage.env, secrets/api.env]
    mem_limit: 1536m
    cpus: 2

  worker:
    <<: *server
    restart: unless-stopped
    command: [worker]
    env_file: [secrets/storage.env, secrets/worker.env]
    mem_limit: 1g
    cpus: 1

volumes:
  postgres-data:
