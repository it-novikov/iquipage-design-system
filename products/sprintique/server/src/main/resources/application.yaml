# Every setting comes from an environment variable with the SPRINTIQUE_ prefix; this file names them all.
spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jooq.autoconfigure.JooqAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  address: ${SPRINTIQUE_HOST:127.0.0.1}
  port: ${SPRINTIQUE_PORT:4311}
  shutdown: graceful
  tomcat:
    max-swallow-size: 1MB
    connection-timeout: 15s
  error:
    whitelabel:
      enabled: false

sprintique:
  environment: ${SPRINTIQUE_ENVIRONMENT:development}
  public-origin: ${SPRINTIQUE_PUBLIC_ORIGIN:http://localhost:4311}
  trust-proxy: ${SPRINTIQUE_TRUST_PROXY:}
  metrics-token: ${SPRINTIQUE_METRICS_TOKEN:}
  dev-login: ${SPRINTIQUE_DEV_LOGIN:false}
  # Local stand only: synthetic sessions of the settings preview (role:token,...).
  preview-sessions: ${SPRINTIQUE_PREVIEW_SESSIONS:}
  web-root: ${SPRINTIQUE_WEB_ROOT:}
  # Enabled features (workbench_read_internal, workbench_personal_state, workbench_requests, workbench_waiting,
  # workbench_plan_horizon, workbench_mvp), `all` or `none`; empty is `all` outside production, `none` in it.
  features: ${SPRINTIQUE_FEATURES:}
  workbench:
    cursor-secret: ${SPRINTIQUE_WORKBENCH_CURSOR_SECRET:}
  database:
    url: ${SPRINTIQUE_DATABASE_URL:}
    worker-url: ${SPRINTIQUE_WORKER_DATABASE_URL:}
    migration-url: ${SPRINTIQUE_MIGRATION_DATABASE_URL:}
    runtime-role: ${SPRINTIQUE_DATABASE_RUNTIME_ROLE:}
    worker-role: ${SPRINTIQUE_DATABASE_WORKER_ROLE:}
  sign-in:
    trust-file: ${SPRINTIQUE_PROVIDER_TRUST_FILE:}
    google:
      issuer: ${SPRINTIQUE_GOOGLE_ISSUER:https://accounts.google.com}
      client-id: ${SPRINTIQUE_GOOGLE_CLIENT_ID:}
      client-secret: ${SPRINTIQUE_GOOGLE_CLIENT_SECRET:}
    apple:
      issuer: ${SPRINTIQUE_APPLE_ISSUER:https://appleid.apple.com}
      client-id: ${SPRINTIQUE_APPLE_CLIENT_ID:}
      team-id: ${SPRINTIQUE_APPLE_TEAM_ID:}
      key-id: ${SPRINTIQUE_APPLE_KEY_ID:}
      private-key-file: ${SPRINTIQUE_APPLE_PRIVATE_KEY_FILE:}
  mail:
    from: ${SPRINTIQUE_MAIL_FROM:}
    # Local stand only: write sign-in letters into this directory instead of sending them.
    drop: ${SPRINTIQUE_MAIL_DROP:}
    smtp:
      host: ${SPRINTIQUE_SMTP_HOST:}
      port: ${SPRINTIQUE_SMTP_PORT:587}
      username: ${SPRINTIQUE_SMTP_USERNAME:}
      password: ${SPRINTIQUE_SMTP_PASSWORD:}
      security: ${SPRINTIQUE_SMTP_SECURITY:starttls}
  storage:
    endpoint: ${SPRINTIQUE_STORAGE_ENDPOINT:}
    region: ${SPRINTIQUE_STORAGE_REGION:}
    bucket: ${SPRINTIQUE_STORAGE_BUCKET:}
    access-key-id: ${SPRINTIQUE_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${SPRINTIQUE_STORAGE_SECRET_ACCESS_KEY:}
    prefix: ${SPRINTIQUE_STORAGE_PREFIX:}

