<!doctype html>
<html lang="ru" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>IQUIPAGE 05.7 — Повседневная работа</title><style>__IQ_CSS__</style><style>
html,body{margin:0;min-height:100%;background:var(--iq-canvas);color:var(--iq-ink);font-family:var(--iq-font)}
.daily-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:8px 24px;border-bottom:1px solid var(--iq-line);background:var(--iq-canvas)}
.daily-brand{font:600 13px/1.5 var(--iq-font);text-decoration:none;color:var(--iq-ink);letter-spacing:.04em}.daily-brand small{font-size:11px;font-weight:400;letter-spacing:0;color:var(--iq-muted);margin-left:12px}
.daily-top nav{display:flex;gap:8px;align-items:center}.daily-top .iq-btn{font-size:12px}
.daily-main{max-width:1440px;margin:auto;min-width:0;padding:20px 24px 40px}
.daily-main>iq-reading-demo{max-width:880px;margin-inline:auto;padding:24px 0}
@media(max-width:640px){.daily-top{padding:8px 16px;gap:8px;flex-wrap:wrap}.daily-brand small{display:none}.daily-top nav{gap:4px}.daily-top .iq-btn{font-size:11px;padding:6px 8px;min-height:32px}.daily-main{padding:12px 12px 28px}.daily-main>iq-reading-demo{padding:8px 0}.daily-top>.daily-brand{font-size:12px}}
</style></head><body><a class="skip-link" href="#everyday-main">К содержимому</a><header class="daily-top"><a class="daily-brand" href="index.html">IQUIPAGE<small>Повседневная работа / 05.7</small></a><nav aria-label="Примеры"><button class="iq-btn ghost sm" id="daily-work" aria-pressed="true" type="button">Рабочий экран</button><button class="iq-btn ghost sm" id="daily-read" aria-pressed="false" type="button">Чтение</button><button class="iq-btn secondary sm" id="daily-theme" type="button" aria-label="Включить тёмную тему">Тёмная тема</button></nav></header><main id="everyday-main" class="daily-main"><iq-everyday-demo id="standalone-work"></iq-everyday-demo><iq-reading-demo page hidden></iq-reading-demo></main><script>__IQ_SCRIPT__</script><script>
const w=document.querySelector('iq-everyday-demo'),r=document.querySelector('iq-reading-demo');function mode(read){w.hidden=read;r.hidden=!read;document.querySelector('#daily-read').setAttribute('aria-pressed',String(read));document.querySelector('#daily-work').setAttribute('aria-pressed',String(!read));}document.querySelector('#daily-read').onclick=()=>mode(true);document.querySelector('#daily-work').onclick=()=>mode(false);document.querySelector('#daily-theme').onclick=function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.textContent=dark?'Светлая тема':'Тёмная тема';this.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');};
</script></body></html>
